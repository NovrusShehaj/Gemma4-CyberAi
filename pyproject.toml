[project]
name = "gemma-cyber"
version = "0.1.0"
description = "Cybersecurity-specialized language model built on gemma3:4b, served via Ollama."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Novrus Shehaj" }]

# Milestone 1 (Phase 1 + start of Phase 2) dependencies ONLY.
# Training deps (transformers/peft/trl/bitsandbytes) are intentionally NOT here —
# they run in the cloud (see PROJECT_PLAN.md §12, §20) and are added in Phase 4.
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
gemma-cyber = "gemma_cyber.cli.main:main"
gemma-cyber-serve = "gemma_cyber.api.server:run"

[project.optional-dependencies]
# The HTTP API / web service (Phase 7/8). Kept out of core deps so the CLI and
# eval harness install with zero web dependencies.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyjwt[crypto]>=2.8",
]

# dev includes the api stack + httpx so CI exercises the API via TestClient.
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_cyber"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom deliberately calls Depends()/Header()/
# Query() in argument defaults; that is not the B008 mutable-default footgun.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "peft.*",
    "trl.*",
    "bitsandbytes.*",
    "datasets.*",
]
ignore_missing_imports = true


