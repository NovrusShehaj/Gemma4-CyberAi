[project]
name = "gemma-cyber"
version = "0.1.0"
description = "Cybersecurity-specialized language model built on gemma3:4b, served via Ollama."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Novrus Shehaj" }]

# Milestone 1 (Phase 1 + start of Phase 2) dependencies ONLY.
# Training deps (transformers/peft/trl/bitsandbytes) are intentionally NOT here —
# they run in the cloud (see PROJECT_PLAN.md §12, §20) and are added in Phase 4.
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
gemma-cyber = "gemma_cyber.cli.main:main"
gemma-cyber-serve = "gemma_cyber.api.server:run"
# Opt-in local terminal agent (extra `agent`). Installing the base package does
# NOT install typer/rich/prompt_toolkit, so `gemma4` exists but refuses to run
# with a clear message until the extra is present — tools never appear by accident.
gemma4 = "gemma_cyber.agent.cli:main"

[project.optional-dependencies]
# The HTTP API / web service (Phase 7/8). Kept out of core deps so the CLI and
# eval harness install with zero web dependencies.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyjwt[crypto]>=2.8",
]

# The opt-in local terminal agent (`gemma4`). Deliberately NOT a core dependency:
# installing `[agent]` is the explicit decision that tool execution exists at all
# (GEMMA4_TERMINAL_AGENT_IMPLEMENTATION_PLAN.md §6, Appendix A). Do not add
# langchain / llama-index / textual / openai / anthropic / chromadb here.
agent = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "httpx>=0.27",
    "pathspec>=0.12",
]

# dev includes the api stack + httpx so CI exercises the API via TestClient, and
# the agent stack so tests/agent and mypy cover the agent package in CI.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "pathspec>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_cyber"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
# The agent runtime is asyncio at the edge (plan §5); `auto` lets `async def`
# tests run without decorating every one of them.
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom deliberately calls Depends()/Header()/
# Query() in argument defaults; that is not the B008 mutable-default footgun.
# Typer's Option()/Argument() are the same pattern for the `gemma4` CLI.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query",
    "typer.Option", "typer.Argument",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "peft.*",
    "trl.*",
    "bitsandbytes.*",
    "datasets.*",
    # mlx / mlx-lm are the LOCAL Apple-Silicon training + eval path (see
    # configs/training/requirements-train-mlx.txt). Not in uv.lock; imported lazily.
    "mlx.*",
    "mlx_lm.*",
    # uvicorn is a runtime-only (api-extra) dependency imported inside server.run();
    # the dev/CI env type-checks without it. Runtime installs it via the api extra.
    "uvicorn.*",
]
ignore_missing_imports = true


