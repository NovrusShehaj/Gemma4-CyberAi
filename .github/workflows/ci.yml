name: CI

# Automated regression detection: run the test suite on every push and PR.
# The suite is environment-safe — it needs no Ollama, no models, and no external
# LLM/API. The one live inference test auto-skips when Ollama is unreachable, and the
# LLM-judge tests mock the provider at the client boundary.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the project virtual environment
        # A uv-managed venv (uv downloads its own CPython 3.12 — not the runner's
        # externally-managed /usr Python, which PEP 668 forbids installing into).
        # Match the project's supported interpreter (pyproject: >=3.11,<3.13).
        # Expose it to later steps via PATH + VIRTUAL_ENV so every step runs here.
        run: |
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install project (with dev deps)
        run: uv pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check src tests scripts

      - name: Run mypy type check
        run: mypy src tests scripts

      - name: Run tests
        run: pytest
