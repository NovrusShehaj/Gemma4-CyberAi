# Gemma-Cyber — reference reverse-proxy (edge) configuration.
#
# This is a VERSIONED REFERENCE, not a turnkey production file: the hostname,
# TLS certificate paths, and upstream address are deployment-specific and MUST be
# supplied by the operator. It documents the public-edge security contract the
# application relies on (docs/deployment.md §edge). The app itself terminates NO
# TLS and sets NO HSTS — those belong here, at the edge.
#
# It implements, at the edge:
#   * HTTPS + HSTS + modern TLS               (transport)
#   * request body size limit                 (abuse / DoS)
#   * pre-auth IP rate limiting               (abuse, before the app sees a token)
#   * trusted forwarded-client headers        (real client IP, not spoofable)
#   * SSE-friendly proxying (no buffering)    (streaming correctness)
#   * bounded proxy timeouts                  (slow-loris / hung upstream)
#   * Ollama is NEVER proxied                 (model runtime stays private)

# Pre-auth IP rate limit zone (tune to your capacity; this protects the app
# before authentication, complementing the app's per-identity limiter).
limit_req_zone $binary_remote_addr zone=gc_edge:10m rate=60r/m;

# Trust ONLY your load balancer / proxy hop for X-Forwarded-For. Replace with the
# real trusted CIDR(s); do not trust arbitrary clients' forwarded headers.
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

upstream gemma_cyber_api {
    # The API is bound to localhost / the private network only. Never expose it
    # or Ollama (11434) directly to the internet.
    server 127.0.0.1:8000;
    keepalive 16;
}

# Redirect all plaintext to HTTPS.
server {
    listen 80;
    server_name gemma-cyber.example.com;   # <-- set your hostname
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gemma-cyber.example.com;    # <-- set your hostname

    # TLS — supply real certificate paths.
    ssl_certificate     /etc/ssl/certs/gemma-cyber.pem;     # <-- set
    ssl_certificate_key /etc/ssl/private/gemma-cyber.key;   # <-- set
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # HSTS is set HERE (the TLS terminator), never by the app. Enable only once
    # you are committed to HTTPS for this domain (2 years, include subdomains).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Cap request bodies at the edge (the app also bounds prompt size, but an
    # oversized HTTP body should be rejected before it reaches the process).
    client_max_body_size 256k;

    # Bounded timeouts.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;   # long enough for a full streamed generation

    location / {
        limit_req zone=gc_edge burst=20 nodelay;

        proxy_pass http://gemma_cyber_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: do not buffer streamed responses (the app also sends
        # X-Accel-Buffering: no on /v1/generate streams).
        proxy_buffering off;
        proxy_cache off;
    }

    # Health probes may be scraped by the platform; keep them cheap and unlogged.
    location = /health {
        access_log off;
        proxy_pass http://gemma_cyber_api;
    }
}
