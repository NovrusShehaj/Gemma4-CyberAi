# MLX-LoRA config for Gemma-Cyber v0.2 (exp-002r) — LOCAL Apple-Silicon path.
#
# Mirror of configs/training/qlora_gemma3_4b_v0.2.yaml (the CUDA/QLoRA cloud path)
# translated to mlx-lm's config schema. Same base model, same effective batch (8),
# same LoRA rank (16) and alpha/rank ratio (scale = alpha/rank = 32/16 = 2.0),
# same dropout, same 3 epochs, same 1024 max sequence length, same completion-only
# loss (mask_prompt: true). Consumed by `scripts/train_mlx_lora.py`.
#
# Base weights: mlx-community/gemma-3-4b-it-4bit (the 4-bit MLX conversion of
# google/gemma-3-4b-it — the HF equivalent of the Ollama `gemma3:4b` anchor).
# 4-bit base + bf16 adapters == the QLoRA recipe.

model: "mlx-community/gemma-3-4b-it-4bit"
train: true
fine_tune_type: "lora"
optimizer: "adamw"

# Data dir is generated by scripts/train_mlx_lora.py from the source JSONL below.
data: "data/training/mlx/sft_v0.2"
_source_dataset: "data/training/sft_v0.2.jsonl"   # (read by the wrapper, not mlx-lm)
_val_fraction: 0.12

seed: 42
# num_layers 16 is mlx-lm's default and the roadmap's verified-practical Apple-Silicon
# setting (§7.2): LoRA on the last 16 transformer blocks. -1 (all 34) ran markedly
# slower on the M3 Max here for no measured quality gain at 277 examples.
num_layers: 16
batch_size: 4
iters: 183                   # ~3 epochs over ~243 train rows at batch 4 (recomputed by wrapper)
max_seq_length: 1024
learning_rate: 0.0002
mask_prompt: true            # completion-only loss (mask every prompt token)
grad_checkpoint: false       # 4B on 128 GB unified memory does not need it

val_batches: -1              # use the whole validation split
steps_per_report: 10
steps_per_eval: 61           # once per epoch
save_every: 61               # checkpoint every epoch
adapter_path: "experiments/exp-002r-gemma3-cyber-v0.2/mlx_adapters"

lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"

lr_schedule:
  name: "cosine_decay"
  warmup: 10
  warmup_init: 1.0e-6
  arguments: [0.0002, 186, 1.0e-5]
