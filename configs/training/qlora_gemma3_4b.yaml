# Training configuration for Gemma-Cyber v0.1 (Phase 4 / Milestone 2)
# Architecture: QLoRA (4-bit NF4 quantized base model + FP16/BF16 Low-Rank Adapters)
# Target Base Model: google/gemma-3-4b-it (or local equivalent)

model:
  base_model_name_or_path: "google/gemma-3-4b-it"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  use_auth_token: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_dataset_path: "data/training/sft_v0.1.jsonl"
  max_seq_length: 2048
  packing: false

training:
  output_dir: "experiments/exp-001-gemma3-cyber-v0.1/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  optim: "paged_adamw_8bit"
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 2
  seed: 42
  report_to: "none"
  bf16: true
  fp16: false
